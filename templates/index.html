<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlowChat</title>
    <link rel="stylesheet" href="/static/styles/index.css">
    <link rel="icon" href="/static/icons/temp_icon.png" type="image/png">
</head>

<body>
    <button id="sidebar-toggle" onclick="toggleSidebar()">≡</button>
    <div id="sidebar" class="sidebar no-select">
        <div class="sidebar-left">
            <button id="auto-layout-btn" onclick="autoLayout()">AL</button>
            <button onclick="wipeState()" class="wipe-btn">W</button>
        </div>
        <div class="sidebar-main">
            <div class="sidebar-header">
                <h3>Project Files</h3>
                <button id="upload-btn" onclick="document.getElementById('sidebar-file-input').click()">Upload</button>
                <input type="file" id="sidebar-file-input" style="display: none;" multiple
                    onchange="uploadSandboxFiles(event)">
            </div>
            <div id="file-tree" class="file-tree"></div>
        </div>
    </div>

    <div id="sidebar-resizer"></div>

    <div id="viewport">
        <div id="nodes-layer">
            <!-- New: SVG Layer for connecting cables -->
            <svg id="edges-layer"
                style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none;"></svg>
            <!-- We removed the dummy node. They will generate dynamically now. -->
        </div>
    </div>

</body>

</html>
<script src="/static/js/globals.js"></script>
<script src="/static/js/api.js"></script>
<script src="/static/js/canvas.js"></script>
<script src="/static/js/nodes.js"></script>
<script src="/static/js/chat.js"></script>
<script src="/static/js/sidebar.js"></script>
<script src="/static/js/main.js"></script>
