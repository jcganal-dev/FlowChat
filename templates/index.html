<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlowChat</title>
    <link rel="stylesheet" href="/static/styles/index.css">
    <link rel="icon" href="/static/icons/temp_icon.png" type="image/png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-okaidia.min.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
</head>

<body class="no-select" onload="Prism.highlightAll()">
    <div id="toolbar-left" class="toolbar-left hidden">
        <button id="center-btn" onclick="centerCanvas()" title="Pan to the last active node"><span
                class="alt-key">H</span></button>
        <button id="auto-layout-btn" onclick="autoLayout()" title="Autolayout">A<span class="alt-key">L</span></button>
        <button onclick="wipeState()" class="wipe-btn"><span class="alt-key"
                title="Wipe entire canvas">W</span></button>
    </div>

    <!-- Floating Sandbox Palette -->
    <div id="sandbox-palette" class="sandbox-palette" style="display: none;">
        <div class="palette-header" id="sandbox-palette-header">
            <h3>Project Files</h3>
            <div class="header-actions">
                <a id="create-folder-btn" onclick="promptCreateFolder()" title="Create Folder"><img
                        src="/static/icons/create-folder.svg" class="file-icon"></a>
                <a id="upload-folder-btn" onclick="document.getElementById('sidebar-folder-input').click()"
                    title="Upload Folder"><img src="/static/icons/upload-folder.svg" class="file-icon"></a>
                <a id="upload-file-btn" onclick="document.getElementById('sidebar-file-input').click()"
                    title="Upload File"><img src="/static/icons/upload-file.svg" class="file-icon"></a>
                <input type="file" id="sidebar-folder-input" style="display: none;" webkitdirectory directory multiple
                    onchange="uploadSandboxFiles(event)">
                <input type="file" id="sidebar-file-input" style="display: none;" multiple
                    onchange="uploadSandboxFiles(event)">
                <a id="close-palette-btn" onclick="document.getElementById('sandbox-palette').style.display='none'"><img
                        src="/static/icons/close.svg" class="file-icon"></a>
            </div>
        </div>
        <div id="file-tree" class="file-tree"></div>
    </div>

    <div id="viewport">
        <div id="nodes-layer">
            <!-- New: SVG Layer for connecting cables -->
            <svg id="edges-layer"
                style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none;"></svg>
            <!-- We removed the dummy node. They will generate dynamically now. -->
        </div>
    </div>

    <!-- Custom Popup Modal -->
    <div id="custom-modal" class="custom-modal" style="display: none;">
        <div class="custom-modal-content">
            <h3 id="custom-modal-title">Alert</h3>
            <p id="custom-modal-message"></p>
            <div id="custom-modal-input-container" style="display: none; align-items: center; gap: 8px;">
                <div id="custom-modal-color-proxy" class="group-color-proxy"
                    style="background-color: #a0a0a0; display: none;" onclick="this.nextElementSibling.click()"></div>
                <input type="color" id="custom-modal-color" style="display: none;" value="#a0a0a0"
                    onchange="this.previousElementSibling.style.backgroundColor = this.value">
                <input type="text" id="custom-modal-input" class="modal-input" style="flex: 1;" />
            </div>
            <div class="custom-modal-actions">
                <button id="custom-modal-cancel" class="modal-btn secondary" style="display: none;">Cancel</button>
                <button id="custom-modal-confirm" class="modal-btn primary">OK</button>
            </div>
        </div>
    </div>

</body>

</html>

<!-- Dependencies for Markdown, Math, and Highlighting -->
<script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked-katex-extension@5.0.0/lib/index.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/highlight.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked-highlight@2.1.0/lib/index.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.8/dist/purify.min.js"></script>

<script src="/static/js/globals.js"></script>
<script src="/static/js/api.js"></script>
<script src="/static/js/canvas.js"></script>
<script src="/static/js/nodes.js"></script>
<script src="/static/js/chat.js"></script>
<script src="/static/js/sidebar.js"></script>
<script src="/static/js/main.js"></script>
