<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlowChat</title>
    <link rel="stylesheet" href="/static/styles/index.css">
    <link rel="icon" href="/static/icons/icon.svg" type="image/png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <link href="https://cdn.jsdelivr.net/gh/PrismJS/prism-themes@master/themes/prism-vsc-dark-plus.css"
        rel="stylesheet" />
    <script src="/static/js/prism.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body class="no-select" onload="Prism.highlightAll();zoom(0);centerCanvas(false)">
    <div class="chat-goto-container" style="display: none;">
        <div id="chats-goto"></div>
    </div>
    <div id="sandbox-palette" class="sandbox-palette" style="display: none;">
        <div class="palette-header" id="sandbox-palette-header">
            <h3>Sandbox Files</h3>
            <div class="header-actions">
                <a id="create-folder-btn" onclick="promptCreateFolder()" title="Create Folder"><img
                        src="/static/icons/create-folder.svg" class="file-icon"></a>
                <a id="upload-folder-btn" onclick="document.getElementById('sidebar-folder-input').click()"
                    title="Upload Folder"><img src="/static/icons/upload-folder.svg" class="file-icon"></a>
                <a id="upload-file-btn" onclick="document.getElementById('sidebar-file-input').click()"
                    title="Upload File"><img src="/static/icons/upload-file.svg" class="file-icon"></a>
                <input type="file" id="sidebar-folder-input" style="display: none;" webkitdirectory directory multiple
                    onchange="uploadSandboxFiles(event)">
                <input type="file" id="sidebar-file-input" style="display: none;" multiple
                    onchange="uploadSandboxFiles(event)">
                <a id="close-palette-btn" onclick="document.getElementById('sandbox-palette').style.display='none'"><img
                        src="/static/icons/close.svg" class="file-icon"></a>
            </div>
        </div>
        <div id="file-tree" class="file-tree"></div>
        <div class="resize-handle" title="Drag to resize"></div>
    </div>

    <div id="viewport">
        <div id="nodes-layer">
            <svg id="edges-layer" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none;">
            </svg>
        </div>
    </div>

    <div class="hint-overlay">
        <div class="bl-toolbar" id="bl-toolbar">
            <div class="zoomadjust">
                <a class="btn-zoom-in btn-bl-tool">
                    <img src="/static/icons/zoomin.svg" class="file-icon" />
                </a>
                <div class="zoomlevel" id="zoomlevel" value="100"></div>
                <a class="btn-zoom-out btn-bl-tool">
                    <img src="/static/icons/zoomout.svg" class="file-icon" />
                </a>
            </div>
            <a class="btn-bl-tool save" title="Save State (Ctrl+S)">
                <img src="/static/icons/save.svg" class="file-icon" />
            </a>
            <a class="btn-bl-tool center" title="Center Canvas (Alt+H)">
                <img src="/static/icons/home.svg" class="file-icon" />
            </a>
            <a class="btn-bl-tool focus" title="Toggle Focus (Alt+F)">
                <img src="/static/icons/focus (2).svg" class="file-icon" />
            </a>
            <a class="btn-bl-tool layout" title="Auto Layout (Alt+L)">
                <img src="/static/icons/layout.svg" class="file-icon" />
            </a>
            <a class="btn-bl-tool wipe danger-btn" title="Wipe State (Alt+W)">
                <img src="/static/icons/bin.svg" class="file-icon" />
            </a>
        </div>
    </div>

    <div id="custom-toast" class="custom-toast" style="display: none;"></div>

    <div id="custom-modal" class="custom-modal" style="display: none;">
        <div class="custom-modal-content">
            <h3 id="custom-modal-title">Alert</h3>
            <p id="custom-modal-message"></p>
            <div id="custom-modal-input-container" style="display: none; align-items: center; gap: 8px;">
                <div id="custom-modal-color-proxy" class="group-color-proxy"
                    style="background-color: #a0a0a0; display: none;" onclick="this.nextElementSibling.click()"></div>
                <input type="color" id="custom-modal-color" style="position: absolute; opacity: 0; pointer-events: none; width: 0; height: 0;" value="#a0a0a0"
                    onchange="this.previousElementSibling.style.backgroundColor = this.value">
                <input type="text" id="custom-modal-input" class="modal-input" style="flex: 1;" />
            </div>
            <div class="custom-modal-actions">
                <button id="custom-modal-cancel" class="modal-btn secondary" style="display: none;">Cancel</button>
                <button id="custom-modal-confirm" class="modal-btn primary">OK</button>
            </div>
        </div>
    </div>
    
    <div id="focus-bg" class="focus-bg" style="display: none;">
        <div id="focus-tab-selection" class="focus-tab-selection">
            <a class="tab-btn" onclick="showSidebar('focus-chat-selection');updateChatHistory()" title="Chat History"><img src="/static/icons/chatnode.svg" class="tab-icon"/></a>
            <a class="tab-btn" onclick="showSidebar('focus-project-files')" title="Sandbox"><img src="/static/icons/sandbox.svg" class="tab-icon"/></a>
        </div>
        <div class="focus-sidebar">
            <div id="focus-chat-selection" style="display: none;" class="focus-chat-selection">
                <div class="focus-sidebar-header">
                    <span><img src="/static/icons/chatnode.svg" class="file-icon"> Chat History</span>
                </div>
                <div id="chat-selection">
    
                </div>
            </div>
            <div id="focus-project-files" class="focus-project-files">
                <div class="focus-sidebar-header">
                    <span><img src="/static/icons/sandbox.svg" class="file-icon"> Sandbox Files</span>
                    <div class="header-actions">
                        <a id="create-folder-btn" onclick="promptCreateFolder()" title="Create Folder"><img
                                src="/static/icons/create-folder.svg" class="file-icon"></a>
                        <a id="upload-folder-btn" onclick="document.getElementById('sidebar-folder-input').click()"
                            title="Upload Folder"><img src="/static/icons/upload-folder.svg" class="file-icon"></a>
                        <a id="upload-file-btn" onclick="document.getElementById('sidebar-file-input').click()"
                            title="Upload File"><img src="/static/icons/upload-file.svg" class="file-icon"></a>
                        <input type="file" id="sidebar-folder-input" style="display: none;" webkitdirectory directory
                            multiple onchange="uploadSandboxFiles(event)">
                        <input type="file" id="sidebar-file-input" style="display: none;" multiple
                            onchange="uploadSandboxFiles(event)">
                        <a id="focus-refresh-files-btn" title="Refresh files" style="cursor: pointer;">
                            <img src="/static/icons/refresh.svg" class="file-icon">
                        </a>
                    </div>
                </div>
                <div id="focus-file-tree" class="focus-file-tree"></div>
            </div>
        </div>
        <div id="focus-main-container" class="focus-main-container">
            <button id="exit-focus-btn" class="exit-focus-btn" title="(Esc) Exit Focus Mode">
                <img src="/static/icons/close.svg" class="file-icon"> Exit Focus
            </button>
            <div id="focus-nodes-layer" class="focus-nodes-layer"></div>
            <div id="focus-chat-placeholder" class="focus-chat-placeholder">
                <h1>Welcome!</h1>
                <h4>Ask anything.</h4>
            </div>
            <div id="focus-input-area" class="focus-input-area">
                <div id="focus-chat-input" class="focus-chat-input"
                    oninput="if(this.innerText.trim()==''){this.innerText=''}" contenteditable="true"
                    spellcheck="true" placeholder="Type prompt here..."></div>
                <div class="focus-chat-input-wrapper">
                    <div class="model-select-container">
                        <div class="model-select-parent" style="position:fixed;margin-top:-316px;display:flex;flex-direction:column-reverse;gap:0px;max-width: 300px;z-index:11;pointer-events: none;">
                            <a class="model-selection focus-model-selection" id="focus-model-selection" style="pointer-events: all;">Loading Models...</a>
                            <div class="model-list" style="visibility: hidden; pointer-events: none;"></div>
                        </div>
                    </div>
                    <div class="focus-button-row">
                        <button id="focus-stop-btn" class="focus-stop-btn" style="display: none;">
                            <img src="/static/icons/stop.svg" class="file-icon">
                        </button>
                        <button id="focus-send-btn" class="focus-send-btn">
                            <img src="/static/icons/send.svg" class="file-icon">
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>

<!-- Dependencies for Markdown, Math, and Highlighting -->
<script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked-katex-extension@5.0.0/lib/index.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/highlight.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked-highlight@2.1.0/lib/index.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.8/dist/purify.min.js"></script>

<script src="/static/js/globals.js"></script>
<script src="/static/js/api.js"></script>
<script src="/static/js/canvas.js"></script>
<script src="/static/js/classes/BaseNode.js"></script>
<script src="/static/js/classes/ChatNode.js"></script>
<script src="/static/js/classes/FileNode.js"></script>
<script src="/static/js/classes/ScrapeNode.js"></script>
<script src="/static/js/nodes.js"></script>
<script src="/static/js/focus.js"></script>
<script src="/static/js/chat.js"></script>
<script src="/static/js/sidebar.js"></script>
<script src="/static/js/watcher.js"></script>
<script src="/static/js/main.js"></script>
<script src="/static/js/toolbar.js"></script>
